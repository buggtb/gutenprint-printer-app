name: Publish immutable OCI release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: oci-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install yq
        run: sudo snap install yq
      - name: Validate release tag, packaged version and stable ancestry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(yq '.version' rockcraft.yaml)"
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            printf 'Tag %s does not match packaged version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          git fetch origin stable --depth=1000000
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/stable; then
            printf 'Tag %s (%s) is not on the verified stable branch\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" >&2
            exit 1
          fi
          {
            echo "version=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "created=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo snap install rockcraft --classic
          sudo snap install yq
          sudo snap install docker
          sudo apt-get update && sudo apt-get install --yes skopeo
          sudo systemctl start docker
          sudo systemctl enable docker
          sudo systemctl is-active --quiet docker || sudo systemctl start docker
      - name: Pack rock for ${{ matrix.arch }}
        run: sudo rockcraft pack --verbosity=trace
      - name: Log in and publish architecture image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/gutenprint-printer-app"
          target="${image}:${VERSION}-${{ matrix.arch }}"
          rock="$(ls *.rock | tail -n 1)"
          echo "$GH_TOKEN" | sudo rockcraft.skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if probe="$(sudo rockcraft.skopeo inspect --creds "$GITHUB_ACTOR:$GH_TOKEN" "docker://${target}" 2>&1)"; then
            printf 'Refusing to overwrite immutable architecture tag %s\n' "$target" >&2
            exit 1
          elif [[ "${probe,,}" != *"manifest unknown"* && "${probe,,}" != *"name unknown"* ]]; then
            printf 'Could not prove architecture tag %s is absent: %s\n' "$target" "$probe" >&2
            exit 1
          fi
          sudo rockcraft.skopeo --insecure-policy copy \
            "oci-archive:${rock}" \
            --dest-creds "$GITHUB_ACTOR:$GH_TOKEN" \
            "docker://${target}"

  publish:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install --yes jq skopeo
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Install syft
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2
        with:
          tool: syft
      - name: Publish annotated multi-architecture index
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          REVISION: ${{ needs.gate.outputs.revision }}
          CREATED: ${{ needs.gate.outputs.created }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/gutenprint-printer-app"
          target="${image}:${VERSION}"
          authfile="$HOME/.docker/config.json"
          if probe="$(skopeo inspect --authfile "$authfile" "docker://${target}" 2>&1)"; then
            printf 'Refusing to overwrite immutable release tag %s\n' "$target" >&2
            exit 1
          elif [[ "${probe,,}" != *"manifest unknown"* && "${probe,,}" != *"name unknown"* ]]; then
            printf 'Could not prove release tag %s is absent: %s\n' "$target" "$probe" >&2
            exit 1
          fi
          for arch in amd64 arm64; do
            source="${image}:${VERSION}-${arch}"
            actual="$(skopeo inspect --authfile "$authfile" "docker://${source}" | jq -r .Architecture)"
            [[ "$actual" == "$arch" ]]
          done
          docker buildx imagetools create \
            --tag "$target" \
            --annotation "index:org.opencontainers.image.title=gutenprint-printer-app" \
            --annotation "index:org.opencontainers.image.description=Gutenprint Printer Application (PAPPL-based printer application for Gutenprint-supported printers)" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            "${image}:${VERSION}-amd64" \
            "${image}:${VERSION}-arm64"
          digest="$(skopeo inspect --authfile "$authfile" "docker://${target}" | jq -r .Digest)"
          [[ "$digest" == sha256:* ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: syft "${IMAGE}@${DIGEST}" -o spdx-json="gutenprint-printer-app.spdx.json"
      - name: Sign image and attach signed SBOM
        id: evidence
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          sbom_digest="$(oras attach --format json --no-tty \
            --artifact-type application/vnd.spdx+json \
            --annotation org.opencontainers.image.title=gutenprint-printer-app-sbom \
            "${IMAGE}@${DIGEST}" \
            gutenprint-printer-app.spdx.json:application/spdx+json | jq -r .digest)"
          [[ "$sbom_digest" == sha256:* ]]
          cosign sign --yes "${IMAGE}@${sbom_digest}"
          echo "sbom-digest=$sbom_digest" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Verify published release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          SBOM_DIGEST: ${{ steps.evidence.outputs.sbom-digest }}
          VERSION: ${{ needs.gate.outputs.version }}
          REVISION: ${{ needs.gate.outputs.revision }}
          CREATED: ${{ needs.gate.outputs.created }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/registry-actions.yml@refs/tags/v${VERSION}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${SBOM_DIGEST}"
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "$GITHUB_REPOSITORY"
          oras discover --format json "${IMAGE}@${DIGEST}" |
            jq -e --arg digest "$SBOM_DIGEST" '.referrers[] | select(.digest == $digest and .artifactType == "application/vnd.spdx+json")'
          raw="$(skopeo inspect --raw "docker://${IMAGE}@${DIGEST}")"
          [[ "$(jq -r '[.manifests[].platform.architecture] | sort | join(" ")' <<< "$raw")" == "amd64 arm64" ]]
          jq -e \
            --arg version "$VERSION" \
            --arg revision "$REVISION" \
            --arg created "$CREATED" \
            --arg source_url "https://github.com/${GITHUB_REPOSITORY}" \
            '.annotations["org.opencontainers.image.title"] == "gutenprint-printer-app" and
             .annotations["org.opencontainers.image.source"] == $source_url and
             .annotations["org.opencontainers.image.version"] == $version and
             .annotations["org.opencontainers.image.revision"] == $revision and
             .annotations["org.opencontainers.image.created"] == $created and
             .annotations["org.opencontainers.image.licenses"] == "Apache-2.0"' <<< "$raw"
